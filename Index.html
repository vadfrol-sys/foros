<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Апартаменты в Форосе — 150 м до моря, вид на море и горы</title>
<meta name="description" content="Посуточная аренда апартаментов в Форосе. 150 метров до моря, панорамный вид на море и горы. Бронирование онлайн.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">

<style>
:root{
  --sand:#E8EEF4;
  --cream:#F5F8FB;
  --terra:#2E6FA8;
  --sea:#0F3556;
  --olive:#4A7A9E;
  --ink:#0A1F33;
  --accent:#C75B39;   /* тёплый акцент только для CTA */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Oswald',sans-serif;
  color:var(--ink);
  background:var(--cream);
  line-height:1.5;
  overflow-x:hidden;
}
body::after{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;z-index:9998;
  opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
h1,h2,h3{font-family:'Russo One',sans-serif;letter-spacing:.02em;line-height:1.15}
h2{font-size:clamp(1.6rem,4vw,2.6rem);color:var(--sea);margin-bottom:.6em;text-align:center}

.section{padding:clamp(48px,8vw,96px) 20px;position:relative}
.container{max-width:1200px;margin:0 auto;position:relative;z-index:1}

.deco-sun{
  position:absolute;top:-60px;right:-60px;width:220px;height:220px;
  border-radius:50%;background:var(--terra);opacity:.10;z-index:0;
}
.deco-waves{
  position:absolute;bottom:0;left:0;right:0;height:80px;z-index:0;
  background:repeating-linear-gradient(90deg,transparent 0 40px,var(--sea) 40px 44px);
  opacity:.06;
}

/* ============ HERO ============ */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;color:#fff;
  overflow:hidden;
  padding:40px 20px;
  background:#0F3556 center/cover no-repeat;
}
.hero-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(15,53,86,.5) 0%,rgba(10,31,51,.7) 100%);
}
.hero-inner{position:relative;z-index:2;max-width:900px}
.hero h1{
  font-size:clamp(2rem,7vw,4.5rem);
  text-shadow:4px 4px 0 rgba(0,0,0,.35);
  margin-bottom:.3em;
  text-transform:uppercase;
}
.hero p{
  font-size:clamp(1rem,2.2vw,1.4rem);
  letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:1.8em;
  text-shadow:2px 2px 0 rgba(0,0,0,.35);
}

/* ============ КНОПКИ ============ */
.btn{
  display:inline-block;
  font-family:'Russo One',sans-serif;
  font-size:clamp(.95rem,1.8vw,1.15rem);
  padding:16px 40px;
  background:var(--accent);
  color:#fff;
  border:3px solid #fff;
  text-decoration:none;text-transform:uppercase;letter-spacing:.1em;
  cursor:pointer;
  box-shadow:6px 6px 0 rgba(0,0,0,.3);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.btn--secondary{
  background:var(--sea);
  margin-left:12px;
}
@media(max-width:600px){
  .btn--secondary{margin-left:0;margin-top:12px}
}

/* ============ БРОНИРОВАНИЕ ============ */
.booking{background:var(--sand)}
.booking-widget{
  background:#fff;
  border:4px solid var(--sea);
  padding:clamp(16px,3vw,32px);
  box-shadow:10px 10px 0 var(--accent);
  min-height:120px;
}

/* ============ ГАЛЕРЕЯ ============ */
.gallery{background:var(--sea);color:#fff;overflow:hidden}
.gallery h2{color:var(--sand)}
.gallery-track-wrap{
  position:relative;
  max-width:1200px;margin:0 auto;
  overflow:hidden;
  border:6px solid var(--sand);
  box-shadow:10px 10px 0 rgba(0,0,0,.35);
}
.gallery-track{
  display:flex;
  transition:transform .8s cubic-bezier(.65,.05,.36,1);
  will-change:transform;
}
.gallery-slide{
  flex:0 0 100%;
  aspect-ratio:16/9;
  position:relative;
  background:#0d2233 center/cover no-repeat;
}
.gallery-slide img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.gallery-controls{
  display:flex;justify-content:center;gap:14px;margin-top:20px;
}
.gallery-btn{
  width:52px;height:52px;
  border:3px solid var(--sand);
  background:transparent;color:var(--sand);
  font-size:1.4rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s;
}
.gallery-btn:hover{background:var(--sand);color:var(--sea)}
.gallery-dots{
  display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;
}
.gallery-dot{
  width:12px;height:12px;border-radius:50%;
  background:rgba(232,238,244,.35);
  border:2px solid var(--sand);
  cursor:pointer;padding:0;
}
.gallery-dot.active{background:var(--accent)}
.gallery-status{
  text-align:center;color:var(--sand);opacity:.7;
  font-size:.85rem;letter-spacing:.1em;margin-top:16px;
}

/* ============ ФУТЕР ============ */
footer{
  background:var(--ink);color:var(--sand);
  padding:48px 20px;text-align:center;
}
footer h3{color:#7FC3F0;margin-bottom:1em;font-size:1.4rem}
.contacts{
  display:flex;flex-wrap:wrap;justify-content:center;gap:20px 40px;
  margin-bottom:24px;
}
.contacts a{
  color:var(--sand);text-decoration:none;
  border-bottom:2px solid transparent;
  font-size:1.1rem;letter-spacing:.05em;
  transition:border-color .2s,color .2s;
}
.contacts a:hover{color:#7FC3F0;border-color:#7FC3F0}
.copy{font-size:.85rem;opacity:.6;letter-spacing:.1em}

/* ============ АДАПТИВ ============ */
@media(max-width:768px){
  .booking-widget{box-shadow:6px 6px 0 var(--accent)}
  .gallery-track-wrap{border-width:4px}
  .gallery-btn{width:44px;height:44px;font-size:1.1rem}
}
@media(max-width:480px){
  .hero{min-height:90vh}
  .contacts{flex-direction:column;gap:12px}
}
</style>
</head>
<body>

<!-- ========================= HERO ========================= -->
<section class="hero">
  <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="./assets/promo-poster.jpg">
    <source src="./assets/promo.mp4" type="video/mp4">
  </video>

  <div class="hero-inner">
    <h1>Апартаменты в Форосе</h1>
    <p>Море &nbsp;•&nbsp; Горы &nbsp;•&nbsp; 150 метров до пляжа</p>
    <a href="#booking" class="btn">Забронировать</a>
    <a href="./objects.html" class="btn btn--secondary">Все апартаменты</a>
  </div>
</section>

<!-- ========================= БРОНИРОВАНИЕ (ПОИСК) ========================= -->
<section class="section booking" id="booking">
  <div class="deco-sun"></div>
  <div class="container">
    <h2>Выберите даты</h2>

    <!-- ▼▼▼ ВИДЖЕТ ПОИСКА HOMERESERVE ▼▼▼ -->
    <div class="booking-widget">

<!-- ========================= ГАЛЕРЕЯ ========================= -->
<section class="section gallery" id="gallery">
  <div class="container">

    <div class="gallery-track-wrap">

  <div class="container">

    </div>

<!-- ========================= СКРИПТЫ САЙТА ========================= -->
<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* ============ ГАЛЕРЕЯ (nginx autoindex, без подписей) ============ */
(function(){
  const GALLERY_URL = './assets/gallery/';
  const INTERVAL = 3000;
  const IMG_RE = /\.(jpe?g|png|webp|gif|avif)$/i;

  const track = document.getElementById('galleryTrack');
  const dotsWrap = document.getElementById('galleryDots');
  const statusEl = document.getElementById('galleryStatus');
  const btnPrev = document.getElementById('galleryPrev');
  const btnNext = document.getElementById('galleryNext');
  const btnPlay = document.getElementById('galleryPlay');

  let index = 0, playing = true, timer = null, total = 0, dots = [];

  function buildGallery(photos){
    track.innerHTML = '';
    dotsWrap.innerHTML = '';
    if(!photos.length){ statusEl.textContent = 'Фотографии скоро появятся'; return; }
    photos.forEach((p, i) => {
      const slide = document.createElement('div');
      slide.className = 'gallery-slide';
      const img = document.createElement('img');
      img.src = p.src;
      img.alt = 'Фото апартаментов в Форосе';
      img.loading = i < 2 ? 'eager' : 'lazy';
      slide.appendChild(img);
      track.appendChild(slide);
    });
    total = photos.length;
    for(let i=0;i<total;i++){
      const d = document.createElement('button');
      d.className = 'gallery-dot' + (i===0?' active':'');
      d.setAttribute('aria-label','Фото ' + (i+1));
      d.addEventListener('click',()=>{ goTo(i); if(playing) start(); });
      dotsWrap.appendChild(d);
    }
    dots = dotsWrap.children;
    statusEl.textContent = total + ' фото • листайте';
    render(); start();
  }

  function render(){
    track.style.transform = 'translateX(' + (-index*100) + '%)';
    for(let i=0;i<total;i++) dots[i].classList.toggle('active', i===index);
  }
  function goTo(i){ index = (i + total) % total; render(); }
  function next(){ goTo(index + 1); }
  function prev(){ goTo(index - 1); }

  function start(){
    if(timer) clearInterval(timer);
    if(total < 2) return;
    timer = setInterval(next, INTERVAL);
    playing = true;
    btnPlay.textContent = '❚❚';
  }
  function stop(){
    if(timer) clearInterval(timer);
    timer = null; playing = false;
    btnPlay.textContent = '▶';
  }

  btnNext.addEventListener('click',()=>{ next(); if(playing) start(); });
  btnPrev.addEventListener('click',()=>{ prev(); if(playing) start(); });
  btnPlay.addEventListener('click',()=> playing ? stop() : start());

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) stop(); else if(!playing && total > 1) start();
  });

  if('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){ if(!timer && playing && total > 1) start(); }
        else { if(timer){ clearInterval(timer); timer=null; } }
      });
    },{threshold:.3});
    io.observe(document.getElementById('gallery'));
  }

  let touchX = null;
  track.addEventListener('touchstart',e=>{ touchX = e.touches[0].clientX; },{passive:true});
  track.addEventListener('touchend',e=>{
    if(touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 40){ dx<0 ? next() : prev(); if(playing) start(); }
    touchX = null;
  });

  fetch(GALLERY_URL, { headers: { 'Accept': 'application/json' } })
    .then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const ct = r.headers.get('content-type') || '';
      if(!ct.includes('json')) throw new Error('Not JSON');
      return r.json();
    })
    .then(files => {
      if(!Array.isArray(files)) throw new Error('Bad format');
      const photos = files
        .filter(f => f && f.type === 'file' && IMG_RE.test(f.name))
        .map(f => ({ src: GALLERY_URL + encodeURIComponent(f.name) }));
      buildGallery(photos);
    })
    .catch(err => {
      console.error('Галерея:', err.message);
      statusEl.textContent = 'Не удалось получить список фото';
    });
})();

/* ============ FALLBACK ДЛЯ ВИДЕО ============ */
(function(){
  const v = document.querySelector('.hero-video');
  if(!v) return;
  v.addEventListener('error',()=>{ v.style.display='none'; });
  setTimeout(()=>{ if(v.readyState < 2) v.style.display='none'; },4000);
})();

/* ============ FALLBACK ДЛЯ КНОПКИ "ЗАБРОНИРОВАТЬ" ============ */
(function(){
  setTimeout(() => {
    const hrWidget = document.getElementById('hr-widget');
    const btn = document.querySelector('.hero .btn');
    if(!hrWidget || !btn) return;
    if(hrWidget.children.length === 0){
      btn.setAttribute('href', '#contacts');
      btn.textContent = 'Связаться';
    }
  }, 2500);
})();
</script>

</body>
